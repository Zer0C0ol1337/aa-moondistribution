[build-system]
build-backend = "hatchling.build"
requires = [
    "hatchling",
]

[project]
name = "aa-moondistribution"
description = "Alliance Auth plugin for the periodic moon distribution of an alliance: corps apply, get scored by activity and moons are assigned automatically."
readme = "README.md"
license = { file = "LICENSE" }
authors = [
    { name = "LeggaSchnegge [3THEL]" },
]
requires-python = ">=3.10"
classifiers = [
    "Environment :: Web Environment",
    "Framework :: Django",
    "Framework :: Django :: 4.2",
    "Intended Audience :: End Users/Desktop",
    "License :: OSI Approved :: GNU General Public License v3 (GPLv3)",
    "Operating System :: OS Independent",
    "Programming Language :: Python",
    "Programming Language :: Python :: 3 :: Only",
    "Topic :: Internet :: WWW/HTTP",
    "Topic :: Internet :: WWW/HTTP :: Dynamic Content",
]
dynamic = [
    "version",
]
dependencies = [
    "allianceauth>=4.0.0",
    "allianceauth-corptools",
    "requests",
]

[project.urls]
Homepage = "https://github.com/Zer0C0ol1337/aa-moondistribution"
Source = "https://github.com/Zer0C0ol1337/aa-moondistribution"
Tracker = "https://github.com/Zer0C0ol1337/aa-moondistribution/issues"

[tool.hatch.version]
path = "moondistribution/__init__.py"

[tool.hatch.build.targets.sdist]
include = [
    "/moondistribution",
    "/README.md",
    "/CHANGELOG.md",
    "/LICENSE",
]

[tool.hatch.build.targets.wheel]
packages = [
    "moondistribution",
]
