# Runs the plugin tests in a fresh Alliance Auth project on every push and pull request
name: tests

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.11", "3.12"]
        allianceauth: ["5.2.0", "5.4.0"]
    services:
      redis:
        image: redis:7
        ports:
          - 6379:6379
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: System packages for mysqlclient
        run: sudo apt-get update && sudo apt-get install -y pkg-config default-libmysqlclient-dev

      - name: Install Alliance Auth, Corptools and the plugin
        run: |
          pip install "allianceauth==${{ matrix.allianceauth }}" "allianceauth-corptools>=3.4" "django-sri<1"
          pip install -e .

      - name: Create a test project (SQLite)
        run: |
          allianceauth start testauth
          cat >> testauth/testauth/settings/local.py <<'PY'
          DATABASES["default"] = {"ENGINE": "django.db.backends.sqlite3", "NAME": "test.sqlite3"}
          INSTALLED_APPS += ["eve_sde", "corptools", "allianceauth.fleetactivitytracking", "moondistribution"]
          ESI_USER_CONTACT_EMAIL = "ci@example.com"
          STORAGES = {
              "default": {"BACKEND": "django.core.files.storage.FileSystemStorage"},
              "staticfiles": {"BACKEND": "django.contrib.staticfiles.storage.StaticFilesStorage"},
          }
          PY

      - name: Check migrations are complete
        working-directory: testauth
        run: python manage.py makemigrations moondistribution --check --dry-run

      - name: Run tests
        working-directory: testauth
        run: python manage.py test moondistribution --noinput
