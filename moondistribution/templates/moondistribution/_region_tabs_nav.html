{% if groups|length > 1 %}
    <ul class="nav nav-tabs mb-2" role="tablist">
        {% for g in groups %}
            <li class="nav-item" role="presentation">
                <button class="nav-link {% if forloop.first %}active{% endif %}" type="button" role="tab"
                        data-bs-toggle="tab" data-bs-target="#{{ prefix }}-{{ g.slug }}">
                    {{ g.region }} <span class="badge text-bg-secondary">{{ g.items|length }}</span>
                </button>
            </li>
        {% endfor %}
    </ul>
{% endif %}
